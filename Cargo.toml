[package]
name = "slender"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bitflags = "2.13.2"
bytemuck = { version = "1.25.2", features = ["derive"] }
env_logger = "0.11.11"
glam = "0.34.0"
gltf = { version = "1.4.1", features = ["import"] }
image = { version = "0.25.10", features = ["png", "jpeg"] }
log = "0.4.34"
pollster = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
slotmap = "1.1.1"
toml = "1.2.1"
wgpu = "30.0.1"
winit = "0.30.13"
